<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="TutorialOverlay">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F7FB"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF4D6D"/><stop offset="0.55" stop-color="#FF7A59"/><stop offset="1" stop-color="#FFC43D"/></linearGradient>
    <clipPath id="frame"><rect width="1280" height="340" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.3">
      <circle cx="120" cy="40" r="170" fill="#FF4D6D"/>
      <circle cx="1180" cy="330" r="190" fill="#3DA9FC"/>
      <circle cx="860" cy="-20" r="140" fill="#9B5DE5"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="28" fill="none" stroke="#E2E5EE"/>

  <text x="72" y="150" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="700" fill="#14161D" letter-spacing="-1.5">Tutorial<tspan fill="url(#title)">Overlay</tspan></text>
  <text x="74" y="200" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="26" fill="#5B6170">Lessons drawn on top of any Windows app</text>
  <g transform="translate(76 238)">
    <rect width="34" height="8" rx="4" fill="#FF4D6D"/><rect x="42" width="34" height="8" rx="4" fill="#FF4D6D"/>
    <rect x="84" width="34" height="8" rx="4" fill="#FF4D6D" opacity="0.55"/><rect x="126" width="34" height="8" rx="4" fill="#E2E5EE"/>
    <rect x="168" width="34" height="8" rx="4" fill="#E2E5EE"/>
  </g>

  <g transform="translate(820 52) rotate(-2)">
    <rect width="380" height="236" rx="16" fill="#12141A" stroke="#3A3E4C"/>
    <text x="24" y="40" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#F0F2F7">Step 3 <tspan font-weight="400" fill="#9CA2B2">of 5</tspan></text>
    <g transform="translate(262 32)"><rect width="18" height="5" rx="2.5" fill="#FF4D6D"/><rect x="22" width="18" height="5" rx="2.5" fill="#FF4D6D"/><rect x="44" width="18" height="5" rx="2.5" fill="#FF4D6D"/><rect x="66" width="18" height="5" rx="2.5" fill="#3A3E4C"/><rect x="88" width="18" height="5" rx="2.5" fill="#3A3E4C"/></g>
    <text x="24" y="78" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#F0F2F7">Kick on steps 1, 5, 9, 13</text>
    <text x="24" y="108" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#FFC43D">Why <tspan font-weight="400" fill="#9CA2B2">“Four on the floor” holds the beat…</tspan></text>
    <circle cx="36" cy="136" r="11" fill="#2EE6A6"/><path d="M31 136 l3.5 3.8 l6.5 -7.5" stroke="#12141A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="141" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#C9CEDB">Step 1</text>
    <circle cx="36" cy="166" r="11" fill="#2EE6A6"/><path d="M31 166 l3.5 3.8 l6.5 -7.5" stroke="#12141A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="171" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#C9CEDB">Step 5</text>
    <circle cx="36" cy="196" r="10" fill="none" stroke="#3A3E4C" stroke-width="2"/><text x="56" y="201" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#C9CEDB">Step 9</text>
    <rect x="216" y="180" width="70" height="36" rx="8" fill="none" stroke="#3A3E4C"/><text x="251" y="203" text-anchor="middle" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#3DA9FC">? <tspan fill="#F0F2F7">Help</tspan></text>
    <rect x="294" y="180" width="64" height="36" rx="8" fill="none" stroke="#FF4D6D"/><text x="326" y="203" text-anchor="middle" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#FF4D6D">Done</text>
  </g>
</svg>
